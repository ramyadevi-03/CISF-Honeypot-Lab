volumes:
  cowrie-var:
    name: cisf-cowrie-var
  opencanary-logs:
    name: cisf-opencanary-logs

services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cisf-cowrie
    environment:
      COWRIE_TELNET_ENABLED: "yes"
    expose:
      - "2222"
      - "2223"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
    networks:
      cisf-lab-net:
        ipv4_address: 10.77.0.10

  suricata:
    image: jasonish/suricata@sha256:d5a3a1785299ab40918d465e54fedf8e3afeeedba76bb64b0cc74dbc20bda2c3
    container_name: cisf-suricata
    network_mode: service:cowrie
    depends_on:
      - cowrie
    command:
      - -c
      - /etc/suricata/suricata.yaml
      - -i
      - eth0
      - --set
      - classification-file=/dev/null
      - --set
      - reference-config-file=/dev/null
      - --set
      - threshold-file=/dev/null
    init: true
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules/lab.rules:/etc/suricata/rules/lab.rules:ro
      - ./suricata/logs:/var/log/suricata

  opencanary:
    image: thinkst/opencanary@sha256:291f43be18a942aac0dcf5ef16148a710d06dd45fccdb5dfda786f8058731cd1
    container_name: cisf-opencanary
    network_mode: service:cowrie
    depends_on:
      - cowrie
    init: true
    read_only: true
    tmpfs:
      - /run
      - /tmp
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./opencanary/opencanary.conf:/root/.opencanary.conf:ro
      - opencanary-logs:/var/tmp

networks:
  cisf-lab-net:
    name: cisf-lab-net
    external: true
